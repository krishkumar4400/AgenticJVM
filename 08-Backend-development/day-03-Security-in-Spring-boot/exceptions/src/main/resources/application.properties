spring.application.name=exceptions

server.port=8000

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/errorsDB
spring.datasource.username=postgres
spring.datasource.password=Krish@9661

# JPA + Hibernate
# spring.jpa.hibernate.ddl-auto=validate or none
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Optional: Dialect (helps Hibernate generate proper SQL for Postgres)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.application.name=blogApp

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5434/blog_db
spring.datasource.username=blog_app_user
spring.datasource.password=blogAt123

# JPA + Hibernate
# spring.jpa.hibernate.ddl-auto=validate or none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: Dialect (helps Hibernate generate proper SQL for Postgres)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
